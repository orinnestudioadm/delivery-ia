# SonarQube configuration for DeliveryIA
sonar.projectKey=deliveryia
sonar.projectName=DeliveryIA
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# TypeScript and JavaScript file inclusions
sonar.inclusions=src/**/*.ts,src/**/*.tsx
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,tests/**/*.spec.ts

# Exclusions
sonar.exclusions=node_modules/**,.next/**,coverage/**,playwright-report/**,test-results/**,public/**

# Coverage reporting from Vitest (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
